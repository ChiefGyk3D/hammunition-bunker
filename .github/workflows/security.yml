#
# CodeQL (Python and the workflows themselves), gitleaks and dependency
# review. The jobs live in ChiefGyk3D/git-your-ship-together.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@8fd4d799a1aabf017afd1aa67350cf8ac8b2e930 # v1.6.1
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    with:
      codeql-queries: security-extended,security-and-quality
      # The one dependency is the engine, pinned by git tag; pip-audit has no
      # requirements file to read for it. The image's packages are Debian's,
      # scanned by Trivy in release.yml.
      pip-audit-requirements: ""
      egress-policy: block
      # No Doppler here: gitleaks needs no licence for a personal account and
      # Snyk is off, so nothing in this workflow reads a secret. On a push to
      # main the OIDC fetch ran and was refused ("claim sub does not match
      # identity auth config": the identity does not list this repository),
      # which failed the job before gitleaks started. Add the repository to
      # the Doppler identity, then these three inputs, if a secret is wanted.
