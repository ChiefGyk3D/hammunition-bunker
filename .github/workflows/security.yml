#
# CodeQL (Python and the workflows themselves), gitleaks and dependency
# review, plus Snyk (token from Doppler over OIDC). The jobs live in
# ChiefGyk3D/git-your-ship-together.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@bcd2cf02a7dfc353d084ffd9c4d7ccd00b5f25c7 # v1.18.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    with:
      codeql-queries: security-extended,security-and-quality
      # The one dependency is the engine, pinned by git tag; pip-audit has no
      # requirements file to read for it. The image's packages are Debian's,
      # scanned by Trivy in release.yml.
      pip-audit-requirements: ""
      egress-policy: block
      # Snyk reads SNYK_TOKEN from the Doppler config over OIDC (no stored secret).
      snyk: true
      # No lock: Snyk Open Source scans a freeze of this install (GYST v1.9.0).
      snyk-install-command: pip install .
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}
