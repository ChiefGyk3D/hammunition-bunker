#
# ruff, ruff format, mypy --strict and pytest on 3.11 to 3.13. The jobs live
# in ChiefGyk3D/git-your-ship-together; its `CI green` job is the one check
# branch protection watches (`ci / CI green`).
#
# The install step resolves the engine pin (Hammunition v0.19.0), which has the
# `artifacts` command, the LAN mirror and every check kind's engine method.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"   # the weekly long fuzz run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@fde2a491de5107c4edb953c8d24f04835c11cb0a # v1.13.0
    permissions:
      contents: read
      id-token: write   # Doppler OIDC, when a Doppler identity is configured
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      distros: '["debian:12", "debian:13", "ubuntu:24.04", "kalilinux/kali-rolling", "parrotsec/core"]'
      distro-runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      python-versions: '["3.11", "3.12", "3.13"]'
      install-command: |
        python -m pip install --upgrade "pip>=25.3"
        pip install -e ".[dev]"
      test-command: pytest -W error::DeprecationWarning
      lint-install-command: pip install -e ".[dev]"
      lint-command: ruff check --output-format=github src tests packaging && ruff format --check src tests packaging && mypy
      # The image refuses to build until ENGINE_SHA256 is filled at the first
      # release; release.yml builds it on a tag.
      docker-build: false
      egress-policy: block
      doppler-project: ci
      doppler-config: ci
      doppler-identity-id: ${{ vars.DOPPLER_IDENTITY_ID }}

  # Atheris targets under fuzz/ (the --json envelope, bunker.toml, the engine's
  # artifacts document, index.json with the status page, the server's paths and
  # ranges), run by GYST: 30 seconds each on a pull request, 10 minutes each on
  # the Monday schedule. A crash fails the job; the input is the fuzz-findings
  # artifact. The engine is a git dependency, so the install clones from GitHub,
  # which the workflow's default allow-list already names.
  fuzz:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-fuzz.yml@fde2a491de5107c4edb953c8d24f04835c11cb0a # v1.13.0
    permissions:
      contents: read
    with:
      seconds-per-target: ${{ github.event_name == 'schedule' && 600 || 30 }}
      timeout-minutes: ${{ github.event_name == 'schedule' && 90 || 30 }}
      install-command: pip install -e .
      egress-policy: block
